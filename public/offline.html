<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>HITUNGIN, sedang offline</title>
		<style>
			body {
				margin: 0;
				min-height: 100dvh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
				box-sizing: border-box;
				background: #f8f9fb;
				color: #334155;
				font-family: system-ui, sans-serif;
				text-align: center;
			}
			h1 { font-size: 18px; color: #1e293b; margin: 0 0 8px; }
			p { font-size: 14px; line-height: 1.6; margin: 0 0 16px; }
			button {
				min-height: 44px;
				padding: 0 20px;
				border: 0;
				border-radius: 10px;
				background: #8b5cf6;
				color: #fff;
				font-weight: 600;
				font-size: 14px;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Tidak ada koneksi internet</h1>
			<p>
				Halaman ini belum tersimpan di perangkat. Sambungkan internet, lalu
				coba lagi. Halaman yang sudah pernah dibuka tetap bisa diakses.
			</p>
			<button type="button" onclick="location.reload()">Coba lagi</button>
		</main>
	</body>
</html>
